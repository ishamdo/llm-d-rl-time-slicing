apiVersion: v1
kind: Pod
metadata:
  name: rl-trainer
  namespace: rl-batch-demo
  labels:
    timeslice.io/job-id: "rl-trainer"
    timeslice.io/group: "trainer-group"
spec:
  containers:
  - name: trainer
    image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
    command: ["python3", "/scripts/rl_trainer.py"]
    env:
    - name: PYTHONPATH
      value: "/sdk"
    - name: BUSY_SECONDS
      value: "20"
    - name: IDLE_SECONDS
      value: "120"
    volumeMounts:
    - name: scripts
      mountPath: /scripts
    resources:
      claims:
      - name: accelerator
  resourceClaims:
  - name: accelerator
    resourceClaimName: trainer-gpu-claim
  nodeSelector:
    group.timeslice.io/trainer-group: "true"
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"
  - key: "timeslice.io/shared"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  volumes:
  - name: scripts
    configMap:
      name: rl-batch-demo-scripts
