apiVersion: v1
kind: Pod
metadata:
  name: timeslice-binary-server
  namespace: timeslice-system
  labels:
    app: timeslice-binary-server
spec:
  containers:
  - name: server
    image: python:3.11-slim
    command: ["/bin/bash", "-c", "mkdir -p /data && python3 -m http.server 8080 --directory /data"]
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: timeslice-binary-server
  namespace: timeslice-system
spec:
  selector:
    app: timeslice-binary-server
  ports:
  - port: 8080
    targetPort: 8080
