apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acceleratororchestrator.fullname" . }}
  namespace: timeslice-system
  labels:
    {{- include "acceleratororchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "acceleratororchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acceleratororchestrator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "acceleratororchestrator.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "ubuntu:22.04"
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/bash"
            - "-c"
            - |
              apt-get update -qq && apt-get install -y -qq curl
              echo "Waiting for orchestrator binary from timeslice-binary-server..."
              until curl -f -sSL http://timeslice-binary-server.timeslice-system.svc.cluster.local:8080/llm-d-rl-time-slicing -o /usr/local/bin/orchestrator; do
                sleep 2
              done
              chmod +x /usr/local/bin/orchestrator
              exec /usr/local/bin/orchestrator
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
